name: CI

on:
  push:
    branches: [master]
  pull_request:

# A pull request's new push cancels its stale run. Each push to master gets a group of its own,
# so a quick second merge can't cancel the first one's run and leave that commit unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What the server would link: normal and build dependencies, on every target.
      - name: The engine has no wasm-bindgen
        run: |
          if cargo tree -p kokonoe-engine -e normal,build --target all --prefix none --locked | grep wasm-bindgen; then
            echo "::error::kokonoe-engine depends on wasm-bindgen. Only kokonoe-wasm may know about JavaScript."
            exit 1
          fi
      - name: The bindings match the checked-in ones
        run: |
          node scripts/bindings.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::The generated bindings differ from the checked-in ones. Run node scripts/bindings.mjs and commit the result."
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The engine's .wasm isn't checked in: pnpm build and pnpm test build it with Rust first.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  # The Dockerfile's image, built on every run so a change that breaks it fails before it merges.
  # Its layers go to the Actions cache, which the deploy builds from. The Docker actions are pinned
  # by commit, since the deploy job that runs them holds the server's SSH key.
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # Each merge to master that passes, onto the server (deploy/): the image goes over SSH, and
  # deploy.sh restarts what changed. Only the newest master deploys, so a slower run of an older
  # merge can't put it back. The production environment holds the server's address, its host key
  # and the deploy user's SSH key, and only master may use them.
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [rust, web, image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      IMAGE: kokonoe:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy only the newest master
        id: newest
        run: |
          if [ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::master has moved on from $GITHUB_SHA; its own run deploys."
          fi
      - if: steps.newest.outputs.newest == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.newest.outputs.newest == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
      - name: Ship the image, and restart the app on it
        if: steps.newest.outputs.newest == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "$IMAGE" | gzip | ssh "deploy@$HOST" 'gunzip | docker load'
          scp deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh "deploy@$HOST:/opt/kokonoe/"
          ssh "deploy@$HOST" sh /opt/kokonoe/deploy.sh "$IMAGE"
      - name: The site answers
        if: steps.newest.outputs.newest == 'true'
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://${{ vars.DOMAIN }}/healthz"
