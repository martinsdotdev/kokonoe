[workspace]
resolver = "3"
members = ["crates/engine", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/martinsdotdev/kokonoe"

[workspace.dependencies]
kokonoe-engine = { path = "crates/engine" }

# The browser module, built by scripts/bindings.mjs: small over fast, for the 100 KB game-screen
# budget. Native builds, the server's included, keep the plain release profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
