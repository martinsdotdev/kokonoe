[workspace]
resolver = "3"
members = ["crates/engine", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/martinsdotdev/kokonoe"

[workspace.dependencies]
kokonoe-engine = { path = "crates/engine" }

# The browser module, built by scripts/bindings.mjs, for the 100 KB game-screen budget. Opt-level
# 2 beats "z" on both counts: 24.4 against 25.9 KB brotli, and about 1.4 times the search's
# iterations per second (KOK-41). 3 searches faster again, for 0.6 KB more. Native builds, the
# server's included, keep the plain release profile.
[profile.wasm]
inherits = "release"
opt-level = 2
lto = true
codegen-units = 1

# The property test plays thousands of games through the engine: optimized, it takes about a
# second instead of twenty. Overflow checks and debug assertions stay on.
[profile.test.package.kokonoe-engine]
opt-level = 2
