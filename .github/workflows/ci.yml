name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What the server would link: normal and build dependencies, on every target.
      - name: The engine has no wasm-bindgen
        run: |
          if cargo tree -p kokonoe-engine -e normal,build --target all --prefix none --locked | grep wasm-bindgen; then
            echo "::error::kokonoe-engine depends on wasm-bindgen. Only kokonoe-wasm may know about JavaScript."
            exit 1
          fi
      - name: The bindings match the checked-in ones
        run: |
          node scripts/bindings.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::The generated bindings differ from the checked-in ones. Run node scripts/bindings.mjs and commit the result."
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The engine's .wasm isn't checked in: pnpm build and pnpm test build it with Rust first.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
